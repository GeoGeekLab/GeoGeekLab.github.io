<p>空间地理大模型已经能够从遥感影像、地图、轨迹和多模态地球观测数据中学习强大的空间表征。但空间表征能力，并不等于地理理解。</p>
<p>这篇交互式 Field Note 聚焦一个更严格的问题：模型是否能够在跨区域、跨尺度和分布偏移条件下，稳定处理空间依赖、区域异质性与机制解释。核心判断是：空间可以被表征，地理则必须被推理。</p>
