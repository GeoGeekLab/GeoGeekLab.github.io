name: OVERPASS / round-2 landing preview
on:
  push:
    branches: [feature/overpass-r2-landing]
    paths:
      - '.github/workflows/overpass-r2.yml'
      - 'overpass/**'
      - 'tests/overpass/**'
      - 'playwright.overpass.config.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    name: Pinned source / subpath build / browser preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify original Watched pin
        run: node overpass/scripts/assert-upstream.mjs
      - name: Install original Watched
        working-directory: overpass/upstream
        run: npm ci --no-audit --no-fund
      - name: Original Watched engine and UI regression
        working-directory: overpass/upstream
        run: npm test
      - name: Apply isolated visual and path overlay
        run: node overpass/scripts/prepare-r2.mjs
      - name: Typecheck branded build
        working-directory: overpass/upstream
        run: npm run typecheck
      - name: Build complete Watched with /overpass/ base
        working-directory: overpass/upstream
        env:
          VITE_SITE_ORIGIN: https://geogeeklab.github.io/overpass
        run: npm run build
      - name: Adapt dynamic public paths and smoke-test
        run: |
          node overpass/scripts/adapt-dist.mjs
          node overpass/scripts/smoke-r2.mjs
      - name: Verify existing GeoGeek source and Lab contracts
        run: npm run qa:build && npm run qa:lab
      - name: Assemble scoped /overpass/ preview
        run: node overpass/scripts/assemble-preview.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checks and screenshots
        run: npx playwright test -c playwright.overpass.config.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overpass-r2-browser
          path: test-results/overpass/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload standalone preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overpass-r2-static-preview
          path: overpass/preview-root/overpass/
          if-no-files-found: error
          retention-days: 14
