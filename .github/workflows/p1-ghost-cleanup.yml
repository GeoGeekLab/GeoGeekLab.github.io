name: P1 homepage ghost cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1-ghost-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired homepage production code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def replace_once(text, old, new, label):
              count = text.count(old)
              require(count == 1, f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def remove_between(text, start, end, label, keep_end=True):
              a = text.find(start)
              require(a >= 0, f'{label}: start marker not found')
              b = text.find(end, a + len(start))
              require(b >= 0, f'{label}: end marker not found')
              return text[:a] + (text[b:] if keep_end else text[b + len(end):])

          def find_matching(text, open_pos, opener='{', closer='}'):
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(text):
                  c = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      j = text.find('*/', i + 2)
                      require(j >= 0, 'unterminated CSS comment')
                      i = j + 2
                      continue
                  if text.startswith('//', i) and opener != '{':
                      j = text.find('\n', i + 2)
                      i = len(text) if j < 0 else j + 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == opener:
                      depth += 1
                  elif c == closer:
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise SystemExit('unbalanced structure')

          def remove_named_structure(text, needle, opener, closer, label):
              a = text.find(needle)
              require(a >= 0, f'{label}: marker not found')
              o = text.find(opener, a + len(needle) - 1)
              require(o >= 0, f'{label}: opening delimiter not found')
              c = find_matching(text, o, opener, closer)
              end = c + 1
              if end < len(text) and text[end] == ',':
                  end += 1
              if end < len(text) and text[end] == '\n':
                  end += 1
              return text[:a] + text[end:]

          def split_selectors(header):
              parts, start = [], 0
              paren = bracket = 0
              quote = None
              escape = False
              for i, c in enumerate(header):
                  if quote:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '(':
                      paren += 1
                  elif c == ')':
                      paren = max(0, paren - 1)
                  elif c == '[':
                      bracket += 1
                  elif c == ']':
                      bracket = max(0, bracket - 1)
                  elif c == ',' and paren == 0 and bracket == 0:
                      parts.append(header[start:i].strip())
                      start = i + 1
              parts.append(header[start:].strip())
              return [p for p in parts if p]

          def next_open_brace(text, start):
              quote = None
              escape = False
              i = start
              while i < len(text):
                  c = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      j = text.find('*/', i + 2)
                      if j < 0:
                          return -1
                      i = j + 2
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '{':
                      return i
                  i += 1
              return -1

          def header_parts(header):
              m = re.match(r'(?s)(\s*(?:(?:/\*.*?\*/\s*)*))(.*)$', header)
              return (m.group(1), m.group(2).strip()) if m else ('', header.strip())

          def strip_comments(text):
              return re.sub(r'/\*.*?\*/', '', text, flags=re.S).strip()

          orbital_home_tokens = (
              '.orbital-threshold', '.orbital-shell', '.orbital-stage',
              '.orbital-threshold-canvas', '.orbital-grid', '.orbital-status',
              '.orbital-datum', '.orbital-source', '.orbital-hover',
              '.orbital-selected', '.orbital-trace-key', '.orbital-copy',
              '.orbital-eyebrow', '#orbitalThresholdCanvas'
          )
          retired_home_tokens = (
              '.selected-work', '.home-project-grid', '.project-card-home',
              '.now-grid', '.life-tile', '.atlas-preview'
          )

          def exact_home_commons(selector):
              if re.search(r'\.home-commons(?![-\w])', selector):
                  return True
              prefixes = (
                  '.home-commons-head', '.home-commons-title', '.home-commons-metrics',
                  '.home-commons-toolbar', '.home-commons-field-label', '.home-commons-horizon',
                  '.home-commons-map-mount', '.home-commons-map-legend', '.home-commons-map-source',
                  '.home-commons-foot', '.commons-gateway-', '.commons-portal-link'
              )
              return any(token in selector for token in prefixes)

          def is_ghost_selector(selector):
              if 'body.orbital-active' in selector:
                  return True
              if any(token in selector for token in orbital_home_tokens):
                  return True
              if any(token in selector for token in retired_home_tokens):
                  return True
              if exact_home_commons(selector):
                  return True
              return False

          def prune_css_block(text):
              out = []
              pos = 0
              while pos < len(text):
                  brace = next_open_brace(text, pos)
                  if brace < 0:
                      out.append(text[pos:])
                      break
                  close = find_matching(text, brace)
                  raw_header = text[pos:brace]
                  prefix, core = header_parts(raw_header)
                  body = text[brace + 1:close]
                  lower = core.lower()

                  if lower.startswith(('@media', '@supports', '@container', '@layer')):
                      cleaned = prune_css_block(body)
                      if strip_comments(cleaned):
                          out.append(prefix + core + '{' + cleaned + '}')
                  elif core.startswith('@'):
                      out.append(raw_header + '{' + body + '}')
                  else:
                      selectors = split_selectors(core)
                      kept = [s for s in selectors if not is_ghost_selector(s)]
                      if kept:
                          new_core = ', '.join(kept)
                          out.append(prefix + new_core + '{' + body + '}')
                  pos = close + 1
              return ''.join(out)

          # app.js: retain current Hero / Coordinates / Commons behavior, remove retired homepage renderers.
          path = 'site/app.js'
          text = read(path)
          text, n = re.subn(r'\n  function setAll\(selector, values, root = document\) \{.*?\n  \}\n', '\n', text, count=1, flags=re.S)
          require(n == 1, 'app.js: setAll helper cleanup failed')
          home_start = text.find("    if (pageKey === 'home') {")
          home_else = text.find("    } else {\n      const pageCopy =", home_start)
          require(home_start >= 0 and home_else > home_start, 'app.js: homepage locale branch not found')
          lean_home = """    if (pageKey === 'home') {\n      setText('.hero-tagline', ui.hero?.tagline);\n      setText('.hero-origin-entry a', ui.hero?.origin);\n      const heroOrigin = $('.hero-origin-entry a');\n      if (heroOrigin) {\n        heroOrigin.href = '/origin/';\n        if (ui.hero?.originAria) heroOrigin.setAttribute('aria-label', ui.hero.originAria);\n      }\n      setText('.hero-edge-right', ui.hero?.right);\n"""
          text = text[:home_start] + lean_home + text[home_else:]
          text = text.replace(".contour-target, .preview-row, .note-row, .lab-row, .life-tile, .elsewhere-card", ".contour-target, .preview-row, .note-row, .lab-row, .elsewhere-card")
          text = remove_between(text, '\n  function renderHome() {', '\n  function initNotes() {', 'app.js renderHome')
          text = replace_once(text, '  renderHome();\n', '', 'app.js renderHome invocation')
          write(path, text)

          # ux-refinements.js: remove Selected Work and homepage Orbital behavior, keep shared mobile/navigation refinements.
          path = 'site/ux-refinements.js'
          text = read(path)
          text = remove_between(text, '  // Surface three actual Field Notes immediately after the hero without duplicating content data.\n', '  // Compact information-scale readout, with keyboard and touch disclosure.\n', 'ux JS selected/orbital block')
          text = text.replace("link.closest('.preview-row, .project-card-home, .atlas-preview')", "link.closest('.preview-row')")
          old_shelves = """  if (pageKind === 'home') {\n    $('#selected-work')?.setAttribute('data-ux-shelf', 'selected-work');\n    $('#now')?.setAttribute('data-ux-shelf', 'coordinates');\n    $('#lab')?.setAttribute('data-ux-shelf', 'lab');\n    $('#elsewhere')?.setAttribute('data-ux-shelf', 'elsewhere');\n  }\n"""
          new_shelves = """  if (pageKind === 'home') {\n    $('#now')?.setAttribute('data-ux-shelf', 'coordinates');\n  }\n"""
          text = replace_once(text, old_shelves, new_shelves, 'ux JS mobile shelf block')
          text = remove_between(text, '  // Touch vocabulary: "MOVE" is a mouse instruction and reads incorrectly on phones.\n', '  // Auto-hide bottom dock while reading down; restore on upward intent or near page end.\n', 'ux JS orbital mobile cue')
          text = re.sub(r'^\s*tuneOrbitalCue\(\);\n', '', text, flags=re.M)
          write(path, text)

          # content.js: remove data only consumed by the retired homepage modules.
          path = 'site/content.js'
          text = read(path)
          text = re.sub(r'^\s*"orbitalSection":.*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^\s*"orbitalCanvas":.*\n', '', text, count=1, flags=re.M)
          text = remove_named_structure(text, '        "orbitalThreshold": {', '{', '}', 'content orbitalThreshold')
          text = remove_named_structure(text, '        "home": {', '{', '}', 'content retired ui.home')
          text = re.sub(r'^\s*"eyebrow": "A PERSONAL ATLAS OF SPACE, TIME & TRACE",\n', '', text, count=1, flags=re.M)
          text = remove_named_structure(text, '          "lexicon": [', '[', ']', 'content hero lexicon')
          write(path, text)

          # CSS: prune only selectors tied to removed homepage modules. Preserve shared Lab project cards and .orbital-lab-*.
          for path in ('site/styles.css', 'site/ux-refinements.css'):
              original = read(path)
              cleaned = prune_css_block(original)
              require(len(cleaned) < len(original), f'{path}: no ghost CSS removed')
              write(path, cleaned)

          # Homepage no longer needs project preview enhancement runtime.
          path = 'site/index.html'
          text = read(path)
          text = replace_once(text, '<script src="previews.js"></script>\n', '', 'index previews.js')
          write(path, text)

          # Documentation: make the architecture contract reflect the current Hero → Coordinates → Commons IA.
          path = 'STATIC_DELIVERY_ARCHITECTURE.md'
          text = read(path)
          text = replace_once(
              text,
              '- Homepage selected work is static. A compact plain-language orientation layer explains GIS / remote sensing / GeoAI / visualization and exposes READ / BUILD / EXPLORE routes.\n',
              '- Homepage IA is intentionally compact: Hero → Coordinates → Commons. The Hero carries the GeoGeek identity, “Geo to see. Geek to build.”, and the factual domain descriptor “GIS / GeoAI / Remote Sensing”; Field Notes / Lab / Atlas / Elsewhere remain primary navigation destinations rather than duplicated homepage shelves.\n- Retired Selected Work, homepage Orbital, legacy project / atlas / elsewhere shelves, and the former Commons gateway are excluded from production homepage CSS and JavaScript.\n',
              'architecture homepage IA'
          )
          text = replace_once(
              text,
              '- Non-critical legacy scripts (`previews.js`, Commons visit tracking) are converted to idle delivery; previews are omitted from article routes. Existing semantic-scale and visualization code is left intact unless it is already route-specific in the legacy templates.\n',
              '- Route-specific preview code is omitted from the homepage and article routes; `previews.js` remains on routes that actually render project previews. Commons visit tracking stays non-critical where applicable. Existing semantic-scale and active visualization code is retained.\n',
              'architecture preview delivery'
          )
          text = replace_once(
              text,
              '- homepage selected work and orientation exist without JavaScript;\n',
              '- homepage Hero, domain descriptor, Coordinates, and Commons exist in first-response HTML, while retired homepage shelves are absent from production CSS and JavaScript;\n',
              'architecture final invariant'
          )
          write(path, text)

          # Source-level invariants before the full build/QA pass.
          app = read('site/app.js')
          uxjs = read('site/ux-refinements.js')
          content = read('site/content.js')
          index = read('site/index.html')
          styles = read('site/styles.css')
          uxcss = read('site/ux-refinements.css')

          for token in ('function renderHome()', '#latestNotes', '#homeProjects', '#homeAtlas', '#lifePreview', '#orbital-threshold', '#commons-gateway'):
              require(token not in app, f'app.js still contains retired token: {token}')
          for token in ('selectedWork', 'orbitalThresholdCanvas', 'orbitalInstruction', 'tuneOrbitalCue', 'project-card-home', "#selected-work"):
              require(token not in uxjs, f'ux-refinements.js still contains retired token: {token}')
          require('"orbitalThreshold": {' not in content, 'content.js still contains orbitalThreshold')
          require('\n        "home": {' not in content, 'content.js still contains retired top-level ui.home')
          require('<script src="previews.js"></script>' not in index, 'homepage still loads previews.js')
          require('.orbital-lab' in styles, 'active orbital Lab styles were accidentally removed')
          require('.project-grid' in styles and '.project-card' in styles, 'active Lab project styles were accidentally removed')
          require('.home-commons-full' in styles, 'current homepage Commons styles were accidentally removed')
          for css_name, css in (('styles.css', styles), ('ux-refinements.css', uxcss)):
              for token in ('.selected-work', '.home-project-grid', '.project-card-home', '.now-grid', '.life-tile', '.atlas-preview', '.orbital-threshold', 'body.orbital-active'):
                  require(token not in css, f'{css_name} still contains retired selector: {token}')
              require(not re.search(r'\.home-commons(?![-\w])', css), f'{css_name} still contains retired .home-commons gateway selector')

          print('P1 source cleanup invariants passed.')
          PY

      - name: Syntax, build, and QA
        shell: bash
        run: |
          node --check site/app.js
          node --check site/ux-refinements.js
          node --check site/content.js
          npm run build
          npm run qa

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/p1-ghost-cleanup.yml
          git config user.name "GeoGeek cleanup bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove retired homepage CSS and JS"
          git push origin HEAD:main
