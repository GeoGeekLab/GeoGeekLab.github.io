name: OVERPASS / P12 complete API source build (no deploy)
on:
  push:
    branches: [feature/overpass-p12-full-runtime]
    paths:
      - 'overpass/scripts/prepare-p12-full-runtime.mjs'
      - 'overpass/scripts/p12-runtime-preflight.mjs'
      - 'overpass/scripts/p12-live-runtime-smoke.mjs'
      - 'tests/overpass-p12/**'
      - '.github/workflows/overpass-p12-full-ci.yml'
      - '.github/workflows/overpass-p12-vercel-preview.yml'
      - 'overpass/PROVIDER_TERMS_REVIEW.md'
      - 'overpass/FULL_RUNTIME_DEPLOY.md'
  pull_request:
    paths:
      - 'overpass/scripts/prepare-p12-full-runtime.mjs'
      - 'overpass/scripts/p12-runtime-preflight.mjs'
      - 'overpass/scripts/p12-live-runtime-smoke.mjs'
      - 'tests/overpass-p12/**'
      - '.github/workflows/overpass-p12-full-ci.yml'
      - '.github/workflows/overpass-p12-vercel-preview.yml'
      - 'overpass/PROVIDER_TERMS_REVIEW.md'
      - 'overpass/FULL_RUNTIME_DEPLOY.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dynamic-full-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Source signatures, URL and deployment safety contracts
        run: |
          node --test tests/overpass-p12/*.test.mjs
          node --test tests/overpass-p9/staging-proof.test.mjs
          node overpass/scripts/p8-code-only-merge-gate.mjs
          node overpass/scripts/assert-upstream.mjs
      - name: Install pinned upstream dependencies
        working-directory: overpass/upstream
        run: npm ci --no-audit --no-fund
      - name: Verify upstream API/backend regression (unaltered)
        working-directory: overpass/upstream
        run: npm run test:backend
      - name: Build isolated full OVERPASS with real four API source functions
        run: |
          node overpass/scripts/prepare-r2.mjs
          node overpass/scripts/prepare-p4.mjs
          node overpass/scripts/prepare-p5.mjs
          node overpass/scripts/prepare-p12-full-runtime.mjs
          test -s overpass/upstream/public/LICENSE
          test -s overpass/upstream/public/THIRD_PARTY_NOTICES.md
          node --input-type=module -e 'import fs from "node:fs"; import {validateVercelRoutes} from "./overpass/scripts/prepare-p12-full-runtime.mjs"; validateVercelRoutes(JSON.parse(fs.readFileSync("overpass/upstream/vercel.json")))'
          (cd overpass/upstream && VITE_OVERPASS_STATIC=0 VITE_SITE_ORIGIN=https://overpass.example.org npm run build)
          grep -q 'OVERPASS' overpass/upstream/dist/index.html
          ! grep -q '/overpass/assets/' overpass/upstream/dist/index.html
          test -s overpass/upstream/dist/LICENSE
          test -s overpass/upstream/dist/THIRD_PARTY_NOTICES.md
      - name: Keep non-public HTML and build only for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p12-source-built-full-mode-preview-no-production
          path: |
            overpass/upstream/dist/index.html
            overpass/upstream/dist/LICENSE
            overpass/upstream/dist/THIRD_PARTY_NOTICES.md
          retention-days: 7
