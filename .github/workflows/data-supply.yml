name: Refresh GeoGeek Data Supply

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.delta.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prime from currently deployed data supply
        run: node scripts/prime-data-supply-from-live.mjs
      - name: Record current supply fingerprint
        id: before
        run: |
          fingerprint=$(node scripts/data-supply-fingerprint.mjs)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Materialize pinned reference supply
        run: node scripts/prepare-data-references.mjs
      - name: Refresh upstream snapshots
        run: node scripts/update-data-supply.mjs
      - name: Verify refreshed data supply
        env:
          DATA_SUPPLY_REQUIRE_REFERENCES: '1'
          DATA_SUPPLY_REQUIRE_LAST_KNOWN_GOOD: '1'
        run: node scripts/verify-data-supply.mjs
      - name: Detect supply change
        id: delta
        env:
          BEFORE: ${{ steps.before.outputs.fingerprint }}
        run: |
          after=$(node scripts/data-supply-fingerprint.mjs)
          if [ "$BEFORE" = "$after" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Published data supply is already current; deployment is unnecessary.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Data supply changed: $BEFORE -> $after"
          fi
      - name: Reuse current Lab preview assets
        if: steps.delta.outputs.changed == 'true'
        run: |
          mkdir -p site/assets/lab/previews
          curl --fail --location --retry 3 \
            --output site/assets/lab/sentinel2.jpg \
            https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          for name in earth-observatory orbit earth flow pulse figure world locate zone path; do
            curl --fail --location --retry 2 \
              --output "site/assets/lab/previews/${name}.jpg" \
              "https://geogeeklab.github.io/assets/lab/previews/${name}.jpg"
          done
          sed -Ei 's#src="core/modules\.js(\?[^\"]*)?"#src="core/modules.js?v=20261002b"#' site/lab.html
          grep -F 'src="core/modules.js?v=20261002b"' site/lab.html
      - name: Install responsive image optimizer
        if: steps.delta.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Build refreshed Pages artifact
        if: steps.delta.outputs.changed == 'true'
        run: node scripts/build.mjs
      - name: Verify Field Note bodies
        if: steps.delta.outputs.changed == 'true'
        run: node scripts/verify-field-note-pages.mjs
      - name: QA refreshed artifact
        if: steps.delta.outputs.changed == 'true'
        run: node scripts/qa.mjs
      - name: Upload Pages artifact
        if: steps.delta.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: needs.build.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy refreshed data supply
        id: deployment
        uses: actions/deploy-pages@v4
