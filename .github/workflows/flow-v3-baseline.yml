name: Flow V3 Hardening Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/flow-v3/**'
      - 'tests/flow-v3/**'
      - 'tests/browser/flow-*.spec.mjs'
      - 'site/flow-lab*'
      - 'site/flow/**'
      - 'package.json'
      - '.github/workflows/flow-v3-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-v3-baseline-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  characterize:
    name: Stage 6 provenance, accessibility, performance and Stage 1-5 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Verify scientific core and four mode contracts
        run: npm run qa:flow-v3

      - name: Check existing Flow source syntax
        run: |
          node --check site/flow-lab.js
          node --check site/flow-lab-round2.js
          node --check site/flow/flow-round2.js
          node --check site/flow/v3/core/projection.mjs
          node --check site/flow/v3/core/integrator.mjs
          node --check site/flow/v3/core/analysis.mjs
          node --check site/flow/v3/core/movement.mjs
          node --check site/flow/v3/core/source-policy.mjs
          node --check site/flow/v3/core/telemetry.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare deterministic source preview
        run: |
          mkdir -p dist
          cp -a site/. dist/

      - name: Verify Stage 6 hardening and full desktop/mobile Flow regressions
        run: npx playwright test tests/browser/flow-v3-baseline.spec.mjs tests/browser/flow-v3-science.spec.mjs tests/browser/flow-v3-workbench.spec.mjs tests/browser/flow-v3-analysis.spec.mjs tests/browser/flow-v3-movement.spec.mjs tests/browser/flow-v3-hardening.spec.mjs tests/browser/flow-round2.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2

      - name: Upload baseline geometry, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-v3-stage6-evidence
          retention-days: 21
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            test-results/
            playwright-report/
