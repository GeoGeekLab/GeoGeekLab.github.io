name: Flow V3 Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/flow-v3/**'
      - 'tests/flow-v3/**'
      - 'tests/browser/flow-*.spec.mjs'
      - 'site/flow-lab*'
      - 'site/flow/**'
      - 'package.json'
      - '.github/workflows/flow-v3-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-v3-baseline-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  characterize:
    name: Node contracts + desktop/mobile characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Verify V3 grammar and baseline contracts
        run: npm run qa:flow-v3

      - name: Check existing Flow source syntax
        run: |
          node --check site/flow-lab.js
          node --check site/flow-lab-round2.js
          node --check site/flow/flow-round2.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare deterministic source preview
        run: |
          mkdir -p dist
          cp -a site/. dist/

      - name: Characterize Flow V3 and existing Round2 on desktop and mobile
        run: npx playwright test tests/browser/flow-v3-baseline.spec.mjs tests/browser/flow-round2.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2

      - name: Upload baseline geometry, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-v3-stage1-evidence
          retention-days: 21
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            test-results/
            playwright-report/
