name: GeoGeek Quality

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare production Lab assets
        run: |
          mkdir -p site/assets/lab site/orbital
          curl --fail --location --retry 3 \
            --output site/assets/lab/sentinel2.jpg \
            https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          sed -i 's#src="core/modules.js"#src="core/modules.js?v=20260930c"#' site/lab.html
          base=https://raw.githubusercontent.com/GeoGeekLab/GeoGeekLab.github.io/e4f70762408ce607da84559bcbd421a377b12c0b/site/orbital
          curl --fail --location --retry 3 --output site/orbital/orbital-engine.js "$base/orbital-engine.js"
          curl --fail --location --retry 3 --output site/orbital/propagation.worker.js "$base/propagation.worker.js"
          test -s site/assets/lab/sentinel2.jpg
          test -s site/orbital/orbital-engine.js
          test -s site/orbital/propagation.worker.js

      - name: Install browser quality tools
        run: |
          npm install --no-save @playwright/test@1.55.0 axe-core@4.11.3 @lhci/cli@0.15.1
          npx playwright install --with-deps chromium

      - name: Capture production Lab previews
        run: node scripts/capture-lab-previews.mjs

      - name: Verify production Lab previews
        run: |
          for name in earth-observatory orbit earth flow pulse figure world locate zone path; do
            test -s "site/assets/lab/previews/${name}.jpg"
          done

      - name: Build
        run: npm run build

      - name: Static QA
        run: npm run qa

      - name: Internal links and assets
        run: npm run qa:links

      - name: Browser and accessibility baseline
        run: npm run qa:browser

      - name: Lighthouse baseline
        run: npm run qa:lighthouse

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            .lighthouseci
