name: GeoGeek Quality

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare production data supply
        env:
          DATA_SUPPLY_ALLOW_STALE: '1'
        run: |
          node scripts/prime-data-supply-from-live.mjs
          node scripts/prepare-data-references.mjs
          node scripts/update-data-supply.mjs

      - name: Prepare production Lab assets
        run: |
          mkdir -p site/assets/lab
          curl --fail --location --retry 3 \
            --output site/assets/lab/sentinel2.jpg \
            https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          node scripts/verify-lab-cache-contract.mjs
          test -s site/assets/lab/sentinel2.jpg
          test -s site/core/data-supply.js
          test -s site/data/supply-registry.js
          test -s site/orbital/orbital-engine.js
          test -s site/orbital/orbit-worker.js
          test -s site/orbital/orbit-catalog-source.js
          test -s site/orbital/orbital-enhancements-v3.js
          test -s site/orbital/orbital-lab-v3.css
          test -s site/orbital/data/active.json
          test -s site/orbital/data/active.meta.json
          ! grep -in '\bDEMO\b' site/orbital/orbital-engine.js site/orbital/orbit-worker.js
          node scripts/verify-data-supply.mjs
          node scripts/test-data-supply-contract.mjs

      - name: Install browser quality tools
        run: |
          npm install --no-save @playwright/test@1.55.0 axe-core@4.11.3 @lhci/cli@0.15.1
          npx playwright install --with-deps chromium

      - name: Install responsive image optimizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version

      - name: Capture production Lab previews
        run: node scripts/capture-lab-previews.mjs

      - name: Verify production Lab previews
        run: |
          for name in orbit earth flow pulse figure world water locate zone path project light; do
            test -s "site/assets/lab/previews/${name}.jpg"
          done
          grep -E "const VERSION = 'capture-[0-9a-f]{12}';" site/lab-real-previews.js

      - name: Build
        run: npm run build

      - name: Verify ORIENT release assets
        run: |
          test -s dist/play/orient/data/places.v1.json
          test -s dist/play/orient/data/relations.v1.json
          test -s dist/play/orient/orient-content.js
          test -s dist/play/orient/orient-session.js
          test -s dist/play/orient/orient-adaptation-guard.js
          test -s dist/play/orient/orient-state.js
          test -s dist/play/orient/orient-storage.js
          test -s dist/play/orient/orient-feedback.js
          test -s dist/play/orient/orient-trace-view.js
          test -s dist/play/orient/orient-trace-enhancer.js
          test -s dist/play/orient/orient-ergonomics.js
          test -s dist/play/orient/orient-ergonomics.css
          test -s dist/play/orient/orient.css
          node scripts/verify-lab-cache-contract.mjs --dist
          grep -E "lab-real-previews\.js\?v=capture-[0-9a-f]{12}" dist/lab.html
          grep -F 'orient-state.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient-storage.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient-session.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient-adaptation-guard.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient.js?v=20261010-step09a' dist/play/play-runtime.js
          grep -F 'orient-feedback.js?v=20261003g' dist/play/play-runtime.js
          grep -F 'orient-trace-view.js?v=20261003h' dist/play/play-runtime.js
          grep -F 'orient-trace-enhancer.js?v=20261003h' dist/play/play-runtime.js
          grep -F 'orient-ergonomics.js?v=20261003i' dist/play/play-runtime.js
          grep -F 'orient.css?v=20261003h' dist/play/play-runtime.js
          grep -F 'orient-ergonomics.css?v=20261003i' dist/play/orient/orient-ergonomics.js

      - name: Static QA
        run: |
          node --test site/water/workbench-v6/smoke.test.mjs
          node --test site/water/workbench-v7/smoke.test.mjs
          node --test site/water/workbench-v8/tests/measured-srf.test.mjs
          node --test site/water/workbench-v9/tests/uncertainty.test.mjs
          node --test site/water/workbench-v9/tests/model-integration.test.mjs
          node --test site/water/workbench-v9/tests/startup-recovery.test.mjs
          node --test site/water/workbench-v10/tests/v10-scientific-contract.test.mjs
          node scripts/verify-water-rt-reference.mjs
          node --test site/water/workbench-v10-1/tests/rt-reference.test.mjs
          node --test site/water/workbench-v10-2/tests/ui-foundation.test.mjs
          node --test site/water/workbench-v10-2/tests/ui-components.test.mjs
          node --test site/water/workbench-v10-2/tests/rt-ui.test.mjs
          node --test site/water/workbench-v10-2/tests/bootstrap-order.test.mjs
          node --test site/water/workbench-v10-2/tests/physics-ui.test.mjs
          node --test site/water/workbench-v10-2/tests/analysis-ui.test.mjs
          node --test site/water/workbench-v10-2/tests/atm-sensor-ui.test.mjs
          node --test site/water/workbench-v10-2/tests/uncertainty-ui.test.mjs
          node --test site/water/workbench-v10-2/tests/integration-ui.test.mjs
          npm run qa
          node scripts/verify-play-live-release.mjs --local

      - name: Internal links and assets
        run: npm run qa:links

      - name: Validate Water V10.0 browser tests
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v10.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.1 numerical RT browser tests
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v101.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.2 phase 1-2 UI preview (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v102-foundation.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.2 phase 3 UI components (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v102-components.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.2 phase 4 RT science UI (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v102-rt.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.2 phase 6A physics UI (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v102-physics.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.2 stage 7 analysis (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v102-analysis.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.2 phase 5 uncertainty UI (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v102-uncertainty.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.2 phase 6B atmosphere and sensor (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v102-atm-sensor.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate Water V10.2 all stages 5-7 integration (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v102-integration.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Validate ORIENT release browser suite
        run: npx playwright test -c playwright.orient-release.config.mjs --list

      - name: Validate Pulse Round 5 44px touch-target regression (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/pulse-round5.spec.mjs --grep 'Pulse mobile controls stay touch-sized' --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Browser and accessibility baseline
        run: npm run qa:browser

      - name: Lighthouse baseline
        run: npm run qa:lighthouse

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            playwright-report
            test-results
            .lighthouseci
