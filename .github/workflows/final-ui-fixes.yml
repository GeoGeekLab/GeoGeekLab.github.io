name: One-shot final UI fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ui-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply viewport audit fixes
        run: |
          python <<'PY'
          from pathlib import Path

          # Scope the Lab principle runtime label to the actual bottom principle.
          app = Path('site/app.js')
          text = app.read_text()
          old = "setText('.lab-principle span', ui.lab?.principleLabel || ('EXTENT / RESOLUTION / LIMIT'));"
          new = "setText('.instrument-principle span', ui.lab?.principleLabel || ('EXTENT / RESOLUTION / LIMIT'));"
          if old not in text:
              raise SystemExit('Lab principle selector not found')
          app.write_text(text.replace(old, new, 1))

          lab = Path('site/lab.html')
          text = lab.read_text()
          old = '<section class="lab-principle" aria-label="Instrument principle">'
          new = '<section class="lab-principle instrument-principle" aria-label="Instrument principle">'
          if old not in text:
              raise SystemExit('Lab principle section not found')
          text = text.replace(old, new, 1)
          text = text.replace('earth-lab-preview.css?v=20260930f', 'earth-lab-preview.css?v=20260930g')
          lab.write_text(text)

          # Prevent observation-condition labels from colliding at narrow widths.
          earth_css = Path('site/earth-lab-preview.css')
          text = earth_css.read_text()
          text += '''\n\n/* Viewport audit: condition labels need a stable measure, then stack on phones. */\n.earth-preview-inspector dl div { grid-template-columns: 86px minmax(0,1fr); }\n@media (max-width: 620px) {\n  .earth-preview-inspector dl div { grid-template-columns: 1fr; gap: 4px; }\n  .earth-preview-inspector dd { overflow-wrap: anywhere; }\n}\n'''
          earth_css.write_text(text)

          # Mobile Atlas is a field instrument, not a rounded showcase card.
          atlas_css = Path('site/atlas-page.css')
          text = atlas_css.read_text()
          text += '''\n\n/* Viewport audit: keep Atlas on the site's straight-edged instrument language. */\n@media (max-width: 860px) {\n  body.ux-mobile-v5.atlas-page .atlas-stage {\n    border-radius: 0 !important;\n    box-shadow: none !important;\n  }\n  body.ux-mobile-v5.atlas-page .atlas-foot {\n    margin-top: 32px;\n    padding: 24px 0 0;\n    border: 0;\n    border-top: 1px solid var(--line);\n    border-radius: 0 !important;\n    background: transparent;\n  }\n}\n'''
          atlas_css.write_text(text)

          atlas = Path('site/atlas.html')
          text = atlas.read_text().replace('atlas-page.css?v=20260930a', 'atlas-page.css?v=20260930g')
          atlas.write_text(text)

          # Bust app.js on the primary surfaces and generated field-note template.
          files = [
              Path('site/index.html'), Path('site/field-notes.html'), Path('site/lab.html'),
              Path('site/atlas.html'), Path('site/elsewhere.html'), Path('site/record.html'),
              Path('templates/field-note.html')
          ]
          import re
          for path in files:
              if not path.exists():
                  continue
              source = path.read_text()
              source = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260930g', source)
              path.write_text(source)

          # Bust the bootstrap itself so the already-versioned interaction layer is guaranteed fresh.
          for path in files:
              if not path.exists():
                  continue
              source = path.read_text().replace('/ux-preinit.js?v=20260930b', '/ux-preinit.js?v=20260930g')
              path.write_text(source)

          # Self-delete after applying once.
          workflow = Path('.github/workflows/final-ui-fixes.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify
        run: |
          git diff --check
          grep -q 'instrument-principle span' site/app.js
          grep -q 'lab-principle instrument-principle' site/lab.html
          grep -q 'SCHEMATIC / NOT LIVE' site/lab.html
          ! grep -q 'UTC 13:25\|08 ACTIVE' site/lab.html

      - name: Commit
        run: |
          git config user.name "GeoGeek viewport audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply final viewport audit fixes"
          git push
