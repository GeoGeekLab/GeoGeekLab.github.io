name: P1 homepage ghost cleanup v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1-ghost-cleanup-v3.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded cleanup and update stale QA invariant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/p1-ghost-cleanup.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(.*?)\n\s+PY\n", source, re.S)
          if not match:
              raise SystemExit('Could not extract guarded cleanup script')
          exec(compile(textwrap.dedent(match.group(1)), 'p1-ghost-cleanup.py', 'exec'), {'__name__': '__main__'})

          qa_path = Path('scripts/qa.legacy.mjs')
          qa = qa_path.read_text(encoding='utf-8')
          old = "check((appSource.match(/displayRecordTitle\\(note\\.title\\)/g)||[]).length >= 2,'Archive titles must be consistent on home and collection views.');"
          new = "check((appSource.match(/displayRecordTitle\\(note\\.title\\)/g)||[]).length >= 1,'Archive titles must use the shared displayRecordTitle helper in collection view.');\ncheck(!appSource.includes('function renderHome()'),'Retired homepage archive shelves must not return.');"
          if qa.count(old) != 1:
              raise SystemExit(f'Stale homepage QA invariant not found exactly once: {qa.count(old)}')
          qa_path.write_text(qa.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Syntax, build, and QA
        shell: bash
        run: |
          node --check site/app.js
          node --check site/ux-refinements.js
          node --check site/content.js
          node --check scripts/qa.legacy.mjs
          npm run build
          npm run qa

      - name: Commit cleanup and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/p1-ghost-cleanup.yml
          rm .github/workflows/p1-ghost-cleanup-v2.yml
          rm .github/workflows/p1-ghost-cleanup-v3.yml
          git config user.name "GeoGeek cleanup bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove retired homepage CSS and JS"
          git push origin HEAD:main
