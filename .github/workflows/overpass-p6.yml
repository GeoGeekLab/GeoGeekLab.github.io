name: OVERPASS / P6 GeoGeek Lab integration
on:
  push:
    branches: [feature/overpass-p6-lab-integration]
    paths:
      - '.github/workflows/overpass-p6.yml'
      - 'overpass/**'
      - 'tests/overpass-p6/**'
      - 'playwright.overpass-p6.config.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p6:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install GeoGeek dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify pinned Watched source and license
        run: node overpass/scripts/assert-upstream.mjs
      - name: Install Watched dependencies
        working-directory: overpass/upstream
        run: npm ci --no-audit --no-fund
      - name: P6 isolated Lab integration contract
        run: node --test tests/overpass-p6/*.test.mjs
      - name: P3 catalog and epoch regression
        run: |
          node --test overpass/tests/catalog-parity.test.mjs
          node overpass/scripts/round3-audit.mjs
      - name: Preserve full upstream client/science tests
        working-directory: overpass/upstream
        run: npm test
      - name: Preserve full upstream backend tests
        working-directory: overpass/upstream
        run: npm run test:backend
      - name: GeoGeek host Build and Lab contracts
        run: npm run qa:build && npm run qa:lab
      - name: Apply P2, P4 and P5 source overlays in isolated upstream checkout
        run: |
          node overpass/scripts/prepare-r2.mjs
          node overpass/scripts/prepare-p4.mjs
          node overpass/scripts/prepare-p5.mjs
          cp overpass/tests/results-p4.test.ts overpass/upstream/src/ui/results/overpass-p4.test.ts
          cp overpass/tests/p5-replay-timelapse.test.ts overpass/upstream/src/ui/results/overpass-p5.test.ts
      - name: P4 plus P5 replay, time-lapse and share-link unit regressions
        working-directory: overpass/upstream
        env:
          VITE_OVERPASS_STATIC: '1'
        run: npx vitest run src/ui/results/overpass-p4.test.ts src/ui/results/overpass-p5.test.ts
      - name: Typecheck and build full OVERPASS under /overpass/
        working-directory: overpass/upstream
        env:
          VITE_SITE_ORIGIN: https://geogeeklab.github.io/overpass
          VITE_OVERPASS_STATIC: '1'
        run: npm run build
      - name: Static asset path integrity
        run: |
          node overpass/scripts/adapt-dist.mjs
          node overpass/scripts/smoke-r2.mjs
          node overpass/scripts/license-p5.mjs
          node overpass/scripts/assemble-preview.mjs
      - name: Prepare independent GeoGeek host supply and captured Lab assets
        run: |
          node scripts/prime-data-supply-from-live.mjs
          node scripts/prepare-data-references.mjs
          node scripts/update-data-supply.mjs
          node scripts/reuse-lab-previews.mjs
          mkdir -p site/assets/lab
          curl --fail --location --retry 3 --output site/assets/lab/sentinel2.jpg https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          node scripts/verify-lab-cache-contract.mjs
          node scripts/verify-lab-previews.mjs
      - name: Build unchanged GeoGeek host and verify original 13-instrument release
        run: |
          npm run build
          node scripts/verify-lab-previews.mjs --dist
          node scripts/verify-lab-cache-contract.mjs --dist
          test "$(grep -o 'class="project-card contour-target is-actionable"' dist/lab.html | wc -l)" -eq 13
      - name: Probe live STAC + NASA GIBS without substituting mock images
        run: node overpass/scripts/probe-imagery.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture actual OVERPASS browser output for Lab card
        run: node overpass/scripts/capture-p6-preview.mjs
      - name: Register the standalone instrument and return link in the isolated host
        run: node overpass/scripts/integrate-p6.mjs
      - name: Recheck original Lab and the 14-card integrated contract
        run: |
          node --test tests/overpass-p6/*.test.mjs
          test -s overpass/preview-root/lab.html
          test -s overpass/preview-root/overpass/index.html
          test -s overpass/preview-root/assets/lab/previews/overpass.jpg
          node scripts/verify-lab-previews.mjs --dist
      - name: Browser acceptance of original Results plus Lab navigation and return
        run: |
          npx playwright test -c playwright.overpass-p4.config.mjs
          npx playwright test -c playwright.overpass-p5.config.mjs
          npx playwright test -c playwright.overpass-p6.config.mjs
      - name: Upload live archive observations and catalog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overpass-p6-data-evidence
          path: |
            overpass/reports/p4-live-imagery.json
            overpass/reports/r3-catalog-parity.json
            overpass/reports/p6-preview-capture.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload desktop/mobile Results screenshot and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overpass-p6-results-browser
          path: |
            test-results/overpass-p4/
            test-results/overpass-p5/
            test-results/overpass-p6/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload static app build, not deployed to production
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overpass-p6-combined-static-preview
          path: overpass/preview-root/
          if-no-files-found: error
          retention-days: 14
