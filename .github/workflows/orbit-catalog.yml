name: Refresh Orbit Catalog

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.delta.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prime from currently deployed Orbit snapshot
        run: node scripts/prime-orbit-catalog-from-live.mjs
      - name: Record current snapshot fingerprint
        id: before
        run: |
          fingerprint=$(node -e "const m=require('./site/orbital/data/active.meta.json');process.stdout.write(String(m.sha256)+':'+String(m.fetchedAt))")
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Refresh CelesTrak active OMM snapshot
        run: node scripts/update-orbit-catalog.mjs
      - name: Verify refreshed snapshot
        run: node scripts/verify-orbit-catalog.mjs
      - name: Detect snapshot change
        id: delta
        env:
          BEFORE: ${{ steps.before.outputs.fingerprint }}
        run: |
          after=$(node -e "const m=require('./site/orbital/data/active.meta.json');process.stdout.write(String(m.sha256)+':'+String(m.fetchedAt))")
          if [ "$BEFORE" = "$after" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Published Orbit snapshot is already current; deployment is unnecessary.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Orbit snapshot changed: $BEFORE -> $after"
          fi
      - name: Reuse current Lab preview assets
        if: steps.delta.outputs.changed == 'true'
        run: |
          mkdir -p site/assets/lab/previews
          curl --fail --location --retry 3 \
            --output site/assets/lab/sentinel2.jpg \
            https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          for name in earth-observatory orbit earth flow pulse figure world locate zone path; do
            curl --fail --location --retry 2 \
              --output "site/assets/lab/previews/${name}.jpg" \
              "https://geogeeklab.github.io/assets/lab/previews/${name}.jpg"
          done
          sed -i 's#src="core/modules.js"#src="core/modules.js?v=20261002a"#' site/lab.html
      - name: Install responsive image optimizer
        if: steps.delta.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Build refreshed Pages artifact
        if: steps.delta.outputs.changed == 'true'
        run: node scripts/build.mjs
      - name: Verify Field Note bodies
        if: steps.delta.outputs.changed == 'true'
        run: node scripts/verify-field-note-pages.mjs
      - name: QA refreshed artifact
        if: steps.delta.outputs.changed == 'true'
        run: node scripts/qa.mjs
      - name: Upload Pages artifact
        if: steps.delta.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: needs.build.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy refreshed Orbit snapshot
        id: deployment
        uses: actions/deploy-pages@v4
