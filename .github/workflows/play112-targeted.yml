name: Play 112 Targeted
on:
  push:
    branches:
      - diag/play112-targeted
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/play-entry-pointer.spec.mjs tests/browser/site-visual-readiness.spec.mjs tests/browser/elsewhere-book.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2 --retries=0
