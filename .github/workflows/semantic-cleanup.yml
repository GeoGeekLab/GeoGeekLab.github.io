name: One-shot semantic cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/semantic-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove retired UI semantics
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('site/app.js')
          source = app.read_text()
          old = "const homeLabels = { origin: ui.sheet?.origin, now: ui.sheet?.coordinates, 'commons-gateway': ui.sheet?.commons, 'field-notes': ui.sheet?.fieldNotes, lab: ui.sheet?.lab, atlas: ui.sheet?.atlas, elsewhere: ui.sheet?.elsewhere };"
          new = "const homeLabels = { origin: ui.sheet?.origin, now: ui.sheet?.coordinates, 'field-notes': ui.sheet?.fieldNotes, lab: ui.sheet?.lab, atlas: ui.sheet?.atlas, elsewhere: ui.sheet?.elsewhere };"
          if old not in source:
              raise SystemExit('Expected commons-gateway mapping not found')
          app.write_text(source.replace(old, new, 1))

          css = Path('site/ux-refinements.css')
          text = css.read_text()

          marker = '/* Remove the Commons sub-index entry without removing Commons itself. */\n.sheet-index-sub[data-sheet-link="commons-gateway"]{ display: none !important; }\n\n'
          if marker not in text:
              raise SystemExit('Expected commons-gateway CSS marker not found')
          text = text.replace(marker, '', 1)

          def remove_css_blocks(text, needles):
              lines = text.splitlines(keepends=True)
              out = []
              i = 0
              removed = 0
              while i < len(lines):
                  line = lines[i]
                  if any(needle in line for needle in needles) and '{' in line:
                      depth = line.count('{') - line.count('}')
                      i += 1
                      while i < len(lines) and depth > 0:
                          depth += lines[i].count('{') - lines[i].count('}')
                          i += 1
                      removed += 1
                      continue
                  out.append(line)
                  i += 1
              return ''.join(out), removed

          text, removed = remove_css_blocks(text, ('.orbital-instruction', '.orbital-keyboard-note'))
          if removed < 6:
              raise SystemExit(f'Expected multiple Orbital CSS blocks; removed only {removed}')

          # Remove media queries that became empty after deleting their only retired rule.
          text = text.replace('@media (prefers-reduced-motion: reduce){\n}\n\n', '')
          text = text.replace('@media (max-width: 760px){\n\n}\n\n', '')
          css.write_text(text)

          for retired in (
              'site/orbital/orbital-engine.js',
              'site/orbital/propagation.worker.js',
              'site/orbital/SATLAS_SOURCE.md',
          ):
              path = Path(retired)
              if path.exists():
                  path.unlink()

          workflow = Path('.github/workflows/semantic-cleanup.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify diff
        run: |
          git diff --check
          ! grep -R "commons-gateway" site/app.js site/ux-refinements.css
          ! grep -R "orbital-instruction\|orbital-keyboard-note" site/ux-refinements.css

      - name: Commit cleanup
        run: |
          git config user.name "GeoGeek cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clean retired UI semantics"
          git push
