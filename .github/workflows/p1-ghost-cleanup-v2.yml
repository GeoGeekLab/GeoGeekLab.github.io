name: P1 homepage ghost cleanup v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1-ghost-cleanup-v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse guarded cleanup script on current main
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/p1-ghost-cleanup.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(.*?)\n\s+PY\n", source, re.S)
          if not match:
              raise SystemExit('Could not extract guarded cleanup script')
          script = textwrap.dedent(match.group(1))
          exec(compile(script, 'p1-ghost-cleanup.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Syntax, build, and QA
        shell: bash
        run: |
          node --check site/app.js
          node --check site/ux-refinements.js
          node --check site/content.js
          npm run build
          npm run qa

      - name: Commit cleanup and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/p1-ghost-cleanup.yml
          rm .github/workflows/p1-ghost-cleanup-v2.yml
          git config user.name "GeoGeek cleanup bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove retired homepage CSS and JS"
          git push origin HEAD:main
