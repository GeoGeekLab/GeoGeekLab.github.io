name: Deploy GeoGeek

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Lab raster
        run: |
          mkdir -p site/assets/lab
          curl --fail --location --retry 3 \
            --output site/assets/lab/sentinel2.jpg \
            https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          test -s site/assets/lab/sentinel2.jpg
          sed -i 's#src="core/modules.js"#src="core/modules.js?v=20261002a"#' site/lab.html
      - name: Verify Orbit runtime and snapshot
        run: |
          test -s site/orbital/orbital-engine.js
          test -s site/orbital/orbit-worker.js
          test -s site/orbital/orbit-catalog-source.js
          test -s site/orbital/orbital-enhancements-v3.js
          test -s site/orbital/orbital-lab-v3.css
          test -s site/orbital/data/active.json
          test -s site/orbital/data/active.meta.json
          ! grep -in '\bDEMO\b' site/orbital/orbital-engine.js site/orbital/orbit-worker.js
          node scripts/verify-orbit-catalog.mjs
      - name: Install preview browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Install responsive image optimizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version
      - name: Capture real Lab previews
        run: node scripts/capture-lab-previews.mjs
      - name: Verify real Lab previews
        run: |
          for name in earth-observatory orbit earth flow pulse figure world locate zone path; do
            test -s "site/assets/lab/previews/${name}.jpg"
          done
      - name: Build
        run: node scripts/build.mjs
      - name: Verify Field Note bodies
        run: node scripts/verify-field-note-pages.mjs
      - name: QA
        run: node scripts/qa.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
