name: Deploy GeoGeek

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prime data supply from live Pages
        run: node scripts/prime-data-supply-from-live.mjs
      - name: Materialize pinned reference supply
        run: node scripts/prepare-data-references.mjs
      - name: Refresh data supply for deploy
        env:
          DATA_SUPPLY_ALLOW_STALE: '1'
        run: node scripts/update-data-supply.mjs
      - name: Prepare Lab raster
        run: |
          mkdir -p site/assets/lab
          curl --fail --location --retry 3 \
            --output site/assets/lab/sentinel2.jpg \
            https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          test -s site/assets/lab/sentinel2.jpg
          node scripts/verify-lab-cache-contract.mjs
      - name: Verify data supply runtime and snapshots
        env:
          DATA_SUPPLY_REQUIRE_REFERENCES: '1'
          DATA_SUPPLY_REQUIRE_LAST_KNOWN_GOOD: '1'
        run: |
          test -s site/core/data-supply.js
          test -s site/core/provider-stability.js
          test -s site/core/observatory-entry.js
          test -s site/data/supply-registry.js
          test -s site/orbital/orbital-engine.js
          test -s site/orbital/orbit-worker.js
          test -s site/orbital/orbit-catalog-source.js
          test -s site/orbital/orbital-enhancements-v3.js
          test -s site/orbital/orbital-lab-v3.css
          test -s site/orbital/data/active.json
          test -s site/orbital/data/active.meta.json
          grep -F 'unified-supply-v2' site/orbital/orbit-catalog-source.js
          grep -F "const RELEASE = '20261004b'" site/core/provider-stability.js
          grep -F "const RELEASE = '20261004b'" site/core/observatory-entry.js
          grep -F 'core/provider-stability.js?v=20261004b' site/core/modules.js
          grep -F '0b9a6ceb0a7032713abd9460ac1e995a9c60cd1e' site/core/provider-stability.js
          grep -F 'www.spaceweather.gov/products/aurora-30-minute-forecast' site/core/provider-stability.js
          ! grep -in '\bDEMO\b' site/orbital/orbital-engine.js site/orbital/orbit-worker.js
          node scripts/verify-data-supply.mjs
      - name: Install release browser tools
        run: |
          npm install --no-save playwright@1.55.0 @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Install responsive image optimizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version
      - name: Capture real Lab previews
        run: node scripts/capture-lab-previews.mjs
      - name: Verify real Lab previews
        run: |
          for name in orbit earth flow pulse figure world water locate zone path project light; do
            test -s "site/assets/lab/previews/${name}.jpg"
          done
          grep -E "const VERSION = 'capture-[0-9a-f]{12}';" site/lab-real-previews.js
      - name: Build
        run: node scripts/build.mjs
      - name: Verify ORIENT release assets
        run: |
          test -s dist/play/orient/data/places.v1.json
          test -s dist/play/orient/data/relations.v1.json
          test -s dist/play/orient/orient-content.js
          test -s dist/play/orient/orient-session.js
          test -s dist/play/orient/orient-adaptation-guard.js
          test -s dist/play/orient/orient-state.js
          test -s dist/play/orient/orient-storage.js
          test -s dist/play/orient/orient-feedback.js
          test -s dist/play/orient/orient-trace-view.js
          test -s dist/play/orient/orient-trace-enhancer.js
          test -s dist/play/orient/orient-ergonomics.js
          test -s dist/play/orient/orient-ergonomics.css
          test -s dist/play/orient/orient.css
          node scripts/verify-lab-cache-contract.mjs --dist
          grep -E "lab-real-previews\.js\?v=capture-[0-9a-f]{12}" dist/lab.html
          grep -F 'orient-state.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient-storage.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient-session.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient-adaptation-guard.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient.js?v=20261003f' dist/play/play-runtime.js
          grep -F 'orient-feedback.js?v=20261003g' dist/play/play-runtime.js
          grep -F 'orient-trace-view.js?v=20261003h' dist/play/play-runtime.js
          grep -F 'orient-trace-enhancer.js?v=20261003h' dist/play/play-runtime.js
          grep -F 'orient-ergonomics.js?v=20261003i' dist/play/play-runtime.js
          grep -F 'orient.css?v=20261003h' dist/play/play-runtime.js
          grep -F 'orient-ergonomics.css?v=20261003i' dist/play/orient/orient-ergonomics.js
      - name: Verify Field Note bodies
        run: node scripts/verify-field-note-pages.mjs
      - name: QA
        run: |
          node --test site/water/workbench-v6/smoke.test.mjs
          node --test site/water/workbench-v7/smoke.test.mjs
          node --test site/water/workbench-v8/tests/measured-srf.test.mjs
          node --test site/water/workbench-v9/tests/uncertainty.test.mjs
          node --test site/water/workbench-v9/tests/model-integration.test.mjs
          node --test site/water/workbench-v9/tests/startup-recovery.test.mjs
          node --test site/water/workbench-v10/tests/v10-scientific-contract.test.mjs
          node scripts/qa.mjs
          node scripts/verify-play-live-release.mjs --local
      - name: Water V9 backward compatibility (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-instrument.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: Water V10.0 browser integration (desktop and mobile Chromium)
        run: npx playwright test -c playwright.config.mjs tests/browser/water-v10.spec.mjs --project=desktop-chromium --project=mobile-chromium --workers=2
      - name: ORIENT release browsers
        run: npm run qa:orient:release-browser
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public Observatory release
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          for path in \
            lab.html \
            core/modules.js \
            core/data-supply.js \
            core/provider-stability.js \
            core/observatory-entry.js \
            orbital/data/active.json \
            orbital/data/active.meta.json \
            data/snapshots/usgs-earthquakes-day.geojson \
            data/snapshots/noaa-aurora.json \
            assets/lab/sentinel2.jpg; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 "$base/$path" -o "/tmp/$(basename "$path")"
            test -s "/tmp/$(basename "$path")"
          done
          node scripts/verify-lab-cache-contract.mjs --url "$base/lab.html"
          curl --fail --silent --show-error --location "$base/core/modules.js" | grep -F 'provider-stability.js?v=20261004b'
          curl --fail --silent --show-error --location "$base/core/provider-stability.js" | grep -F "const RELEASE = '20261004b'"
          curl --fail --silent --show-error --location "$base/core/observatory-entry.js" | grep -F "const RELEASE = '20261004b'"
          curl --fail --silent --show-error --location "$base/orbital/orbit-catalog-source.js" | grep -F 'unified-supply-v2'
      - name: Verify public Water V8 measured SRF assets
        env:
          WATER_RELEASE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${WATER_RELEASE_BASE_URL%/}"
          mkdir -p /tmp/geogeek-water-v8
          for path in \
            lab.html \
            core/modules.js \
            water/workbench-v8/instrument.js \
            water/workbench-v8/app/index.html \
            water/workbench-v8/chart-fix.js \
            water/workbench-v8/srf/measured-response-data.js; do
            file="/tmp/geogeek-water-v8/$(basename "$path")"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 "$base/$path?v=20261008v8" -o "$file"
            test -s "$file"
          done
          grep -Fq 'core/modules.js?v=20261008v101' /tmp/geogeek-water-v8/lab.html
          grep -Fq 'WATER_WORKBENCH_V8' /tmp/geogeek-water-v8/modules.js
          grep -Fq 'water/workbench-v8/' /tmp/geogeek-water-v8/instrument.js
          grep -Fq "'app/index.html'" /tmp/geogeek-water-v8/instrument.js
          grep -Fq 'measured-response-data.js?v=8.0.0' /tmp/geogeek-water-v8/index.html
          grep -Fq 'model/measured-sensor-response.js' /tmp/geogeek-water-v8/index.html
          grep -Fq 'pointermove' /tmp/geogeek-water-v8/chart-fix.js
          grep -Fq 'GeoGeekMeasuredSRFData' /tmp/geogeek-water-v8/measured-response-data.js
          grep -Fq 'be6c8291507aadfb75d9abcef6689be1600144dd' /tmp/geogeek-water-v8/measured-response-data.js
          grep -Fq '94753de9654d69ec3be6f19c4b27bf7aa4c8381b' /tmp/geogeek-water-v8/measured-response-data.js
          grep -Fq '8092b059b8c9d46ca8dadfb159b5a0654554464d' /tmp/geogeek-water-v8/measured-response-data.js
          echo 'Water V8 live asset smoke passed: Lab entry, mount, charts, and 3 pinned SRF profiles'
      - name: Verify public Water V9 identifiability assets
        env:
          WATER_RELEASE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${WATER_RELEASE_BASE_URL%/}"
          mkdir -p /tmp/geogeek-water-v9
          for path in \
            lab.html \
            core/modules.js \
            water/workbench-v9/instrument.js \
            water/workbench-v9/app/index.html \
            water/workbench-v9/analysis/uncertainty-engine.js \
            water/workbench-v9/chart-fix.js \
            water/workbench-v9/srf/measured-response-data.js; do
            file="/tmp/geogeek-water-v9/$(basename "$path")"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 "$base/$path?v=20261008v9" -o "$file"
            test -s "$file"
          done
          grep -Fq 'core/modules.js?v=20261008v101' /tmp/geogeek-water-v9/lab.html
          grep -Fq 'WATER_WORKBENCH_V9' /tmp/geogeek-water-v9/modules.js
          grep -Fq 'water/workbench-v9/' /tmp/geogeek-water-v9/instrument.js
          grep -Fq 'uncertainty-engine.js?v=9.0.0' /tmp/geogeek-water-v9/index.html
          grep -Fq 'data-v9-resilience="local-engine-fallback"' /tmp/geogeek-water-v9/index.html
          grep -Fq 'workspaces/uncertainty.js' /tmp/geogeek-water-v9/index.html
          grep -Fq 'uncertaintyAndIdentifiability' /tmp/geogeek-water-v9/index.html
          grep -Fq 'rank-deficient' /tmp/geogeek-water-v9/uncertainty-engine.js
          grep -Fq 'GeoGeekV9Engine' /tmp/geogeek-water-v9/uncertainty-engine.js
          grep -Fq 'pointermove' /tmp/geogeek-water-v9/chart-fix.js
          grep -Fq 'GeoGeekMeasuredSRFData' /tmp/geogeek-water-v9/measured-response-data.js
          echo 'Water V9 live asset smoke passed: 8 workspaces, Fisher diagnostics and V8 SRF'
      - name: Verify public Water V10.0 scientific-contract assets
        env:
          WATER_RELEASE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${WATER_RELEASE_BASE_URL%/}"
          mkdir -p /tmp/geogeek-water-v10
          for path in lab.html core/modules.js water/workbench-v10/instrument.js water/workbench-v10/app/index.html water/workbench-v10/science-contract.js; do
            file="/tmp/geogeek-water-v10/$(basename "$path")"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 "$base/$path?release=20261008v10" -o "$file"
            test -s "$file"
          done
          grep -Fq 'core/modules.js?v=20261008v101' /tmp/geogeek-water-v10/lab.html
          grep -Fq 'WATER_WORKBENCH_V10' /tmp/geogeek-water-v10/modules.js
          grep -Fq 'water/workbench-v10/' /tmp/geogeek-water-v10/instrument.js
          grep -Fq 'schemaVersion:7' /tmp/geogeek-water-v10/index.html
          grep -Fq 'GeoGeekV10Contract' /tmp/geogeek-water-v10/science-contract.js
          echo 'Water V10.0 live asset smoke passed'
      - name: Verify public ORIENT release
        env:
          ORIENT_RELEASE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run qa:orient:production
      - name: Verify all six public PLAY modules
        env:
          PLAY_RELEASE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-play-live-release.mjs

