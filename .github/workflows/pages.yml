name: Deploy GeoGeek

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Lab raster
        run: |
          mkdir -p site/assets/lab
          curl --fail --location --retry 3 \
            --output site/assets/lab/sentinel2.jpg \
            https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          test -s site/assets/lab/sentinel2.jpg
          sed -i 's#src="core/modules.js"#src="core/modules.js?v=20260930c"#' site/lab.html
      - name: Restore Orbit instrument runtime
        run: |
          mkdir -p site/orbital
          base=https://raw.githubusercontent.com/GeoGeekLab/GeoGeekLab.github.io/e4f70762408ce607da84559bcbd421a377b12c0b/site/orbital
          curl --fail --location --retry 3 --output site/orbital/orbital-engine.js "$base/orbital-engine.js"
          curl --fail --location --retry 3 --output site/orbital/propagation.worker.js "$base/propagation.worker.js"
          test -s site/orbital/orbital-engine.js
          test -s site/orbital/propagation.worker.js
      - name: Install preview browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture real Lab previews
        run: node scripts/capture-lab-previews.mjs
      - name: Verify real Lab previews
        run: |
          for name in earth-observatory orbit earth flow pulse figure world locate zone path; do
            test -s "site/assets/lab/previews/${name}.jpg"
          done
      - name: Build
        run: node scripts/build.mjs
      - name: QA
        run: node scripts/qa.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
