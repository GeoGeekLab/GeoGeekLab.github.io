name: Deploy GeoGeek

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prime data supply from live Pages
        run: node scripts/prime-data-supply-from-live.mjs
      - name: Materialize pinned reference supply
        run: node scripts/prepare-data-references.mjs
      - name: Refresh data supply for deploy
        env:
          DATA_SUPPLY_ALLOW_STALE: '1'
        run: node scripts/update-data-supply.mjs
      - name: Prepare Lab raster
        run: |
          mkdir -p site/assets/lab
          curl --fail --location --retry 3 \
            --output site/assets/lab/sentinel2.jpg \
            https://raw.githubusercontent.com/GlobalFishingWatch/frontend/d43ab35fa2ccff9e4b5e22729190defe30e03b72/apps/platform/public/images/layer-library/sentinel2.jpg
          test -s site/assets/lab/sentinel2.jpg
          sed -Ei 's#src="core/modules\.js(\?[^\"]*)?"#src="core/modules.js?v=20261002b"#' site/lab.html
          sed -Ei 's#src="play/play-runtime\.js(\?[^\"]*)?"#src="play/play-runtime.js?v=20261003d"#' site/lab.html
          grep -F 'src="core/modules.js?v=20261002b"' site/lab.html
          grep -F 'src="play/play-runtime.js?v=20261003d"' site/lab.html
      - name: Verify data supply runtime and snapshots
        env:
          DATA_SUPPLY_REQUIRE_REFERENCES: '1'
          DATA_SUPPLY_REQUIRE_LAST_KNOWN_GOOD: '1'
        run: |
          test -s site/core/data-supply.js
          test -s site/data/supply-registry.js
          test -s site/orbital/orbital-engine.js
          test -s site/orbital/orbit-worker.js
          test -s site/orbital/orbit-catalog-source.js
          test -s site/orbital/orbital-enhancements-v3.js
          test -s site/orbital/orbital-lab-v3.css
          test -s site/orbital/data/active.json
          test -s site/orbital/data/active.meta.json
          ! grep -in '\bDEMO\b' site/orbital/orbital-engine.js site/orbital/orbit-worker.js
          node scripts/verify-data-supply.mjs
      - name: Install preview browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Install responsive image optimizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version
      - name: Capture real Lab previews
        run: node scripts/capture-lab-previews.mjs
      - name: Verify real Lab previews
        run: |
          for name in orbit earth flow pulse figure world locate zone path project; do
            test -s "site/assets/lab/previews/${name}.jpg"
          done
      - name: Build
        run: node scripts/build.mjs
      - name: Verify ORIENT release assets
        run: |
          test -s dist/play/orient/data/places.v1.json
          test -s dist/play/orient/data/relations.v1.json
          test -s dist/play/orient/orient-content.js
          test -s dist/play/orient/orient-session.js
          grep -F 'play/play-runtime.js?v=20261003d' dist/lab.html
      - name: Verify Field Note bodies
        run: node scripts/verify-field-note-pages.mjs
      - name: QA
        run: node scripts/qa.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
