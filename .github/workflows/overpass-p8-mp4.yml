name: OVERPASS / P8 real historical imagery to MP4 probe
on:
  push:
    branches: [feature/overpass-p8-staging-release]
    paths:
      - '.github/workflows/overpass-p8-mp4.yml'
      - 'tests/overpass-p8/timelapse-real-mp4.spec.mjs'
      - 'playwright.overpass-p8-video.config.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-mp4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned application dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd overpass/upstream && npm ci --no-audit --no-fund)
      - name: Build Watched static OVERPASS and preserve original science
        run: |
          node overpass/scripts/assert-upstream.mjs
          node overpass/scripts/prepare-r2.mjs
          node overpass/scripts/prepare-p4.mjs
          node overpass/scripts/prepare-p5.mjs
          (cd overpass/upstream && VITE_SITE_ORIGIN=https://geogeeklab.github.io/overpass VITE_OVERPASS_STATIC=1 npm run build)
          node overpass/scripts/adapt-dist.mjs
          node overpass/scripts/license-p5.mjs
          node overpass/scripts/assemble-preview.mjs
      - name: Install Chromium and ffprobe
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download historical Sentinel imagery and encode a real browser MP4
        run: npx playwright test -c playwright.overpass-p8-video.config.mjs
      - name: Keep live MP4 and trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-live-mp4-evidence
          path: test-results/overpass-p8/
          retention-days: 14
          if-no-files-found: warn
